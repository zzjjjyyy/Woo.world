name.oninput=()=>{if(selected){selected.name=name.value||'小羊';tag.textContent=selected.name;save()}};person.oninput=()=>{if(selected){selected.person=person.value;save()}}
function closePanel(){panel.classList.remove('open');offsetGoal=0}document.getElementById('close').onclick=closePanel;document.getElementById('done').onclick=closePanel;
document.querySelectorAll('.bar button').forEach(b=>b.onclick=e=>{e.stopPropagation();if(!selected)return;let s=selected,a=b.dataset.a;if(a==='dress'){panel.classList.add('open');offsetGoal=1.45;fillPanel(s)}else if(a==='delete'){scene.remove(s.root);scene.remove(s.shadow);sheep.splice(sheep.indexOf(s),1);choose(null);save()}else if(a==='copy'){let p=spot(s.root.position.x+.8,s.root.position.z+.55,s),c=makeSheep({x:p[0],z:p[1],name:s.name+'的朋友',color:s.color,acc:s.accType,person:s.person});choose(c);save()}else if(a==='walk')state(s,'walk');else state(s,a)});
panel.addEventListener('pointerdown',e=>e.stopPropagation());
let waves=[];for(let j=0;j<6;j++){let g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(new Float32Array(36*3),3));let l=new THREE.Line(g,new THREE.LineBasicMaterial({color:'#e4f2df',transparent:true,opacity:.4}));scene.add(l);waves.push({l,j})}
function uiPos(){if(!selected)return;let p=selected.root.position.clone().add(new THREE.Vector3(0,1.35,0)).project(camera),x=(p.x*.5+.5)*innerWidth,y=(-p.y*.5+.5)*innerHeight;tag.textContent=selected.name;tag.style.left=Math.max(48,Math.min(innerWidth-48,x))+'px';tag.style.top=Math.max(52,y-7)+'px';tools.style.left=Math.max(155,Math.min(innerWidth-155,x))+'px';tools.style.top=Math.max(56,Math.min(innerHeight-78,y+7))+'px';ring.position.x=selected.root.position.x;ring.position.z=selected.root.position.z}
const ray=new THREE.Raycaster(),mouse=new THREE.Vector2();let down=null,drag=null,dragOff=new THREE.Vector3();
function coords(e){let r=renderer.domElement.getBoundingClientRect();mouse.set((e.clientX-r.left)/r.width*2-1,-((e.clientY-r.top)/r.height)*2+1);ray.setFromCamera(mouse,camera)}
function hit(e){coords(e);let a=[];sheep.forEach(s=>s.root.traverse(o=>{if(o.isMesh)a.push(o)}));let h=ray.intersectObjects(a);return h.length?h[0].object.userData.sheep:null}
function ground(e){coords(e);let p=new THREE.Vector3();ray.ray.intersectPlane(new THREE.Plane(new THREE.Vector3(0,1,0),0),p);return p}
renderer.domElement.addEventListener('pointerdown',e=>{if(e.button!==undefined&&e.button!==0)return;down={x:e.clientX,y:e.clientY,s:hit(e)};renderer.domElement.setPointerCapture(e.pointerId)});
addEventListener('pointermove',e=>{if(!down)return;if(!drag&&down.s&&Math.hypot(e.clientX-down.x,e.clientY-down.y)>5){drag=down.s;choose(drag);drag.state='drag';let p=ground(e);dragOff.set(drag.root.position.x-p.x,0,drag.root.position.z-p.z)}if(drag){let p=ground(e);drag.root.position.x=p.x+dragOff.x;drag.root.position.z=p.z+dragOff.z;drag.lift=.2}});
addEventListener('pointerup',e=>{if(!down)return;if(drag){let p=spot(drag.root.position.x,drag.root.position.z,drag);drag.root.position.x=p[0];drag.root.position.z=p[1];drag.lift=0;state(drag,'idle');save()}else if(down.s)choose(down.s);else choose(null);down=null;drag=null});
let clock=new THREE.Clock(),time=0;
function animate(){let dt=Math.min(clock.getDelta(),.05);time+=dt;offset+=(offsetGoal-offset)*Math.min(1,dt*3);aim.x=offset;camera.position.set(10+offset,13,15);camera.lookAt(aim);
clouds.forEach((c,i)=>{c.position.x+=dt*(i?-.035:.027);if(c.position.x>7)c.position.x=-7;if(c.position.x< -7)c.position.x=7;c.position.y=3.24+Math.sin(time*.45+i)*.035});
for(let w of waves){let a=w.l.geometry.attributes.position;for(let i=0;i<36;i++){let u=i/35,z=-4.2+u*8.4,x=riverX(z)+Math.sin(u*10+w.j*1.7+time*.55)*(.18+(w.j%3)*.06);a.setXYZ(i,x,.056,z)}a.needsUpdate=true}
for(let s of sheep){if(s!==drag){s.phase=(s.phase||0)+dt*(s.state==='walk'?8:2);s.timer-=dt;if(s.timer<=0){if(s.state==='walk'||s.state==='jump'){s.state='idle';s.timer=2+R()*3;s.target=null}else{let r=R();state(s,r<.38?'idle':r<.68?'graze':r<.94?'walk':'jump')}}}
let lift=0,walk=0;if(s.state==='walk'&&s.target){let dx=s.target.x-s.root.position.x,dz=s.target.z-s.root.position.z,dist=Math.hypot(dx,dz),yaw=Math.atan2(-dz,dx),diff=Math.atan2(Math.sin(yaw-s.root.rotation.y),Math.cos(yaw-s.root.rotation.y));s.root.rotation.y+=diff*Math.min(1,dt*2.2);if(Math.abs(diff)<.48){let step=Math.min(dist,s.speed*dt),nx=s.root.position.x+Math.cos(s.root.rotation.y)*step,nz=s.root.position.z-Math.sin(s.root.rotation.y)*step;if(valid(nx,nz,s)){s.root.position.x=nx;s.root.position.z=nz;walk=.42*Math.sin(s.phase)}else{s.target=target(s);if(!s.target){s.state='idle';s.timer=2}}}if(dist<.12){s.state='idle';s.timer=1+R()*3;s.target=null}}
s.legs.forEach((l,i)=>l.rotation.z=walk*((i===0||i===3)?1:-1));s.body.scale.y=1+.018*Math.sin(s.phase*.45);let graze=s.state==='graze'?.16*(.5+.5*Math.sin(time*5)):0;s.head.rotation.z=-graze;s.head.rotation.y=s.state==='idle'?.08*Math.sin(s.phase*.28):.025*Math.sin(s.phase);
if(s.state==='jump'){let t=1.35-s.timer;lift=t<.25?.08*(1-t/.25):t<.9?Math.sin((t-.25)/.65*Math.PI)*.65:Math.max(0,.08*(1-(t-.9)/.45));s.legs.forEach(l=>l.rotation.z+=.12)}
s.root.position.y=lift+(s.lift||0);s.shadow.position.set(s.root.position.x,.025,s.root.position.z);let f=Math.max(.45,1-lift*.65);s.shadow.scale.set(f,f,1);s.shadow.material.opacity=.16*(1-lift*.7)}
if(selected){ring.material.opacity=.72+.18*Math.sin(time*3);uiPos()}renderer.render(scene,camera)}
renderer.setAnimationLoop(animate);
document.querySelector('[data-a="dress"]').addEventListener('click',()=>{offsetGoal=1.45});
panel.addEventListener('transitionend',()=>{if(!panel.classList.contains('open'))offsetGoal=0});
addEventListener('keydown',e=>{if(e.key==='Escape')closePanel()});
})();
</script></body></html>
